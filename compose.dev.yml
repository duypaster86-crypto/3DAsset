name: "3dasset-store-local"

services:
  postgres:
    image: postgres:18-alpine
    container_name: 3dasset-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      POSTGRES_DB: ${POSTGRES_DB:-asset_store_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-asset_store_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
